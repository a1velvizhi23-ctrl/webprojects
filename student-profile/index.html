<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
            text-align:center;
        }

        .container{
            width:300px;
            margin:30px auto;
            padding:20px;
            background:white;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:90%;
            padding:8px;
            margin:8px 0;
        }

        button{
            padding:10px 20px;
            background:blue;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;
        }

        .card{
            width:300px;
            margin:20px auto;
            padding:20px;
            background:white;
            border-radius:10px;
            box-shadow:0 0 10px gray;
            display:none;
        }

        h2{
            color:blue;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Details</h2>

    <input type="text" id="name" placeholder="Enter Student Name">

    <input type="text" id="roll" placeholder="Enter Roll Number">

    <input type="number" id="mark" placeholder="Enter Marks">

    <br><br>

    <button onclick="displayProfile()">Display Profile</button>
</div>

<div class="card" id="profileCard">
    <h2>Student Profile</h2>

    <p><b>Name:</b> <span id="sname"></span></p>

    <p><b>Roll No:</b> <span id="sroll"></span></p>

    <p><b>Marks:</b> <span id="smark"></span></p>

    <p><b>Grade:</b> <span id="sgrade"></span></p>
</div>

<script>
function displayProfile(){

    let name=document.getElementById("name").value;
    let roll=document.getElementById("roll").value;
    let mark=Number(document.getElementById("mark").value);

    let grade="";

    if(mark>=90 && mark<=100)
        grade="A+";
    else if(mark>=80)
        grade="A";
    else if(mark>=70)
        grade="B";
    else if(mark>=60)
        grade="C";
    else if(mark>=50)
        grade="D";
    else
        grade="F";

    document.getElementById("sname").innerHTML=name;
    document.getElementById("sroll").innerHTML=roll;
    document.getElementById("smark").innerHTML=mark;
    document.getElementById("sgrade").innerHTML=grade;

    document.getElementById("profileCard").style.display="block";
}
</script>

</body>
</html>
