<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#74ebd5,#9face6);
        }

        .card{
            background:#fff;
            padding:30px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            width:320px;
        }

        h2{
            margin-bottom:20px;
        }

        #value{
            font-size:60px;
            color:#2c3e50;
            margin-bottom:20px;
        }

        .btn{
            padding:10px 18px;
            margin:5px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            transition:0.3s;
        }

        #add{
            background:#2ecc71;
            color:white;
        }

        #sub{
            background:#e74c3c;
            color:white;
        }

        #clear{
            background:#3498db;
            color:white;
        }

        .btn:hover{
            transform:scale(1.05);
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Counter App</h2>

    <h1 id="value">0</h1>

    <button class="btn" id="add">Increase</button>
    <button class="btn" id="sub">Decrease</button>
    <button class="btn" id="clear">Reset</button>
</div>

<script>

let counter = 0;

const display = document.getElementById("value");

document.getElementById("add").addEventListener("click", function () {
    counter++;
    display.textContent = counter;
});

document.getElementById("sub").addEventListener("click", function () {
    counter--;
    display.textContent = counter;
});

document.getElementById("clear").addEventListener("click", function () {
    counter = 0;
    display.textContent = counter;
});

</script>

</body>
</html>
